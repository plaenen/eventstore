version: '3.8'

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit-smtp-test
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    networks:
      - smtp-test

networks:
  smtp-test:
    driver: bridge
