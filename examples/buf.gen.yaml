version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/plaenen/eventstore/examples/pb
  disable:
    - file_option: go_package
      path: eventsourcing/options.proto
    - file_option: go_package
      path: cqrs/options.proto
plugins:
  # Generate protobuf messages
  - remote: buf.build/protocolbuffers/go
    out: pb
    opt:
      - paths=source_relative

  # Generate Connect RPC
  - remote: buf.build/connectrpc/go
    out: pb
    opt:
      - paths=source_relative

  # Generate Event Sourcing domain model (aggregates, events, handlers)
  - local: ["go", "run", "github.com/plaenen/eventstore/cmd/protoc-gen-eventsourcing"]
    out: pb
    opt:
      - paths=source_relative

  # Generate CQRS infrastructure (client, server, SDK)
  - local: ["go", "run", "github.com/plaenen/eventstore/cmd/protoc-gen-cqrs"]
    out: pb
    opt:
      - paths=source_relative
